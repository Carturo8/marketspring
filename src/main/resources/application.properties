spring.application.name=marketspring

# Import local configuration file for sensitive credentials (if present)
spring.config.import=optional:classpath:application-local.properties

# DataSource (PostgreSQL / Supabase)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Embedded server configuration
server.port=8080

# Logging configuration
logging.level.root=INFO

# Connection Pool Configuration (HikariCP)

# Limits the maximum number of active connections to 3
spring.datasource.hikari.maximum-pool-size=3
# Keeps only 1 idle connection ready for use
spring.datasource.hikari.minimum-idle=1
# Maximum lifetime of a connection (10 minutes)
spring.datasource.hikari.max-lifetime=600000
# Connection timeout to get a connection (30 seconds)
spring.datasource.hikari.connection-timeout=30000