spring.application.name=marketspring

# Import local configuration file for sensitive credentials (if present)
spring.config.import=optional:classpath:application-local.properties

# DataSource (PostgreSQL / Supabase)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.prepare_statement=false

# Embedded server configuration
server.port=8080

# Logging configuration
logging.level.root=INFO

# ================================
# Hikari Connection Pool (Supabase Free Tier Optimized)
# ================================

# Maximum active connections (recommended: 3 for Supabase Free Tier)
spring.datasource.hikari.maximum-pool-size=3

# Keep only 1 idle connection available
spring.datasource.hikari.minimum-idle=1

# Maximum lifetime of a connection (30 seconds)
spring.datasource.hikari.max-lifetime=30000

# Timeout when trying to get a connection (20 seconds)
spring.datasource.hikari.connection-timeout=20000

# How long a connection can stay idle (10 seconds)
spring.datasource.hikari.idle-timeout=10000